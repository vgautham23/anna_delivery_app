<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Address Scanner</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <!-- On-device OCR (free, no API key). -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- HOME -->
  <main id="home" class="screen active">
    <button id="cameraBtn" class="camera-btn" aria-label="Scan delivery bill">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 4.5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/>
      </svg>
    </button>
    <p class="hint">Tap to scan a delivery bill</p>
    <input id="fileInput" type="file" accept="image/*" capture="environment" hidden />
  </main>

  <!-- PROCESSING -->
  <main id="processing" class="screen">
    <img id="preview" class="preview" alt="Captured bill" />
    <div class="progress"><div id="bar" class="bar"></div></div>
    <p id="status" class="hint">Reading text…</p>
  </main>

  <!-- RESULT -->
  <main id="result" class="screen">
    <p id="recipient" class="recipient"></p>
    <label for="addressBox" class="label">Delivery address <span id="conf" class="conf"></span></label>
    <textarea id="addressBox" rows="3" spellcheck="false" placeholder="No address found — type or fix it here"></textarea>
    <p id="notice" class="notice" hidden></p>
    <button id="selectBtn" class="link-btn" type="button">✂ Select the address on the photo</button>
    <div id="cropPanel" class="crop-panel" hidden>
      <p class="hint small">Drag a box around the address with your finger</p>
      <div id="cropArea" class="crop-area">
        <canvas id="cropCanvas"></canvas>
        <div id="cropBox" class="crop-box" hidden></div>
      </div>
      <button id="readAreaBtn" class="primary-btn" type="button" disabled>Read selected area</button>
    </div>
    <div id="mapWrap" class="map-wrap">
      <iframe id="map" title="Map preview" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <div class="actions">
      <button id="retryBtn" class="round retry" aria-label="Scan again">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7a1 1 0 0 0-1.4 0L12 10.6 7.1 5.7a1 1 0 0 0-1.4 1.4l4.9 4.9-4.9 4.9a1 1 0 1 0 1.4 1.4l4.9-4.9 4.9 4.9a1 1 0 0 0 1.4-1.4L13.4 12l4.9-4.9a1 1 0 0 0 0-1.4Z"/></svg>
      </button>
      <button id="confirmBtn" class="round confirm" aria-label="Confirm and navigate">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2Z"/></svg>
      </button>
    </div>
    <details class="raw">
      <summary>Show scanned text</summary>
      <pre id="rawText"></pre>
    </details>
  </main>
</body>
</html>
